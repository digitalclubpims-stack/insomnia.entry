<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CR Verification | INSOMNIA</title><link rel="stylesheet" href="../styles.css"></head><body><main class="shell"><div class="card"><p class="eyebrow">CR PORTAL</p><h1 style="font-size:60px">Verify payments.</h1><p class="muted">Sign in with your assigned CR account. You will only be permitted to act on your assigned batch.</p><input id="email" type="email" placeholder="CR email"><input id="password" type="password" placeholder="Password"><button class="btn primary" id="login">Sign in</button><div id="panel"></div></div></main><script type="module">import{auth,db}from'../src/firebase.js';import{signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';import{collection,query,where,getDocs,doc,getDoc,runTransaction,serverTimestamp,addDoc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';const p=document.querySelector('#panel');login.onclick=async()=>{try{await signInWithEmailAndPassword(auth,email.value,password.value);const me=await getDoc(doc(db,'crs',auth.currentUser.uid));if(!me.exists())throw Error('NO_CR');const batch=me.data().batch;p.innerHTML=`<p>Assigned batch: <b>${batch}</b></p><div id="list">Loading…</div>`;load(batch)}catch(e){p.textContent='Login or authorization failed.'}};async function load(batch){const s=await getDocs(query(collection(db,'tickets'),where('batch','==',batch),where('paymentStatus','==','PENDING')));const list=document.querySelector('#list');list.innerHTML='';if(s.empty){list.textContent='No pending payments.';return}s.forEach(d=>{const t=d.data(),el=document.createElement('article');el.className='card';el.style.marginTop='12px';el.innerHTML=`<b>${safe(t.name)}</b><p>UTR: ${safe(t.utr)} · Amount: ₹${safe(t.amount)}</p><p>Paid to CR: ${safe(t.crName)}</p><button class="btn primary">Verify</button> <button class="btn">Reject</button>`;el.children[3].onclick=()=>act(d.id,'VERIFIED');el.children[4].onclick=()=>act(d.id,'REJECTED');list.append(el)})}async function act(id,status){await runTransaction(db,async tx=>{const ref=doc(db,'tickets',id),s=await tx.get(ref);if(!s.exists()||s.data().batch!==(await getDoc(doc(db,'crs',auth.currentUser.uid))).data().batch)throw Error('FORBIDDEN');tx.update(ref,{paymentStatus:status,verifiedBy:auth.currentUser.uid,verifiedAt:serverTimestamp(),ticketIssued:status==='VERIFIED'});const log=doc(collection(db,'auditLogs'));tx.set(log,{ticketId:id,result:status==='VERIFIED'?'PAYMENT_VERIFIED':'PAYMENT_REJECTED',operatorUid:auth.currentUser.uid,timestamp:serverTimestamp()})});load((await getDoc(doc(db,'crs',auth.currentUser.uid))).data().batch)}function safe(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
