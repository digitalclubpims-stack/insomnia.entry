<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05091F"><title>CR Verification · INSOMNIA</title><link rel="stylesheet" href="../styles.css"></head><body><main class="shell"><header class="site-header"><a class="brand" href="../"><span class="brand-mark"></span><span><span class="brand-name">INSOMNIA</span><span class="brand-sub">CR VERIFICATION</span></span></a><nav class="nav"><a href="../">Home</a><a class="active" href="./">CR Verification</a></nav></header><section class="page"><div class="page-head"><p class="eyebrow">CLASS REPRESENTATIVE PORTAL</p><h1 class="page-title">Verify payments.</h1><p>Sign in with your assigned CR account. You will only see registrations belonging to your assigned batch.</p></div><div class="panel form-panel"><div class="field-grid"><div class="field full"><label for="email">CR email</label><input id="email" type="email" autocomplete="username" placeholder="cr@example.com"></div><div class="field full"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"></div></div><div class="form-actions"><button class="btn primary" id="login">Sign in</button></div><div id="panel"></div></div></section></main><script type="module">import{auth,db}from'../src/firebase.js';import{signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';import{collection,query,where,getDocs,doc,getDoc,runTransaction,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';const p=document.querySelector('#panel');login.onclick=async()=>{p.innerHTML='<div class="status">Signing in…</div>';try{await signInWithEmailAndPassword(auth,email.value,password.value);const me=await getDoc(doc(db,'crs',auth.currentUser.uid));if(!me.exists())throw Error('NO_CR');const batch=me.data().batch;p.innerHTML=`<div class="status success">Signed in · assigned batch ${batch}</div><div id="list" style="margin-top:14px">Loading pending payments…</div>`;load(batch)}catch(e){p.innerHTML='<div class="status error">Login or authorization failed.</div>'}};async function load(batch){const s=await getDocs(query(collection(db,'tickets'),where('batch','==',batch),where('paymentStatus','==','PENDING')));const list=document.querySelector('#list');list.innerHTML='';if(s.empty){list.innerHTML='<div class="status success">No pending payments for this batch.</div>';return}s.forEach(d=>{const t=d.data(),el=document.createElement('article');el.className='panel';el.style.cssText='padding:18px;margin-top:10px';el.innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start"><div><strong style="font-size:17px">${safe(t.name)}</strong><p style="color:#91a4b6;margin:7px 0 0;font-size:13px">UTR: ${safe(t.utr)} · Amount: ₹${safe(t.amount)} · Paid to: ${safe(t.crName)}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn success verify">Verify</button><button class="btn danger reject">Reject</button></div></div>`;el.querySelector('.verify').onclick=()=>act(d.id,'VERIFIED');el.querySelector('.reject').onclick=()=>act(d.id,'REJECTED');list.append(el)})}async function act(id,status){try{const me=await getDoc(doc(db,'crs',auth.currentUser.uid));const batch=me.data().batch;await runTransaction(db,async tx=>{const ref=doc(db,'tickets',id),s=await tx.get(ref);if(!s.exists()||s.data().batch!==batch)throw Error('FORBIDDEN');tx.update(ref,{paymentStatus:status,verifiedBy:auth.currentUser.uid,verifiedAt:serverTimestamp(),ticketIssued:status==='VERIFIED'});const log=doc(collection(db,'auditLogs'));tx.set(log,{ticketId:id,result:status==='VERIFIED'?'PAYMENT_VERIFIED':'PAYMENT_REJECTED',operatorUid:auth.currentUser.uid,timestamp:serverTimestamp()})});load(batch)}catch(e){alert('This action could not be completed.')}}function safe(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
