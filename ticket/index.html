<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket | INSOMNIA</title><link rel="stylesheet" href="../styles.css"></head><body><main class="shell"><div class="card" style="max-width:520px;margin:7vh auto"><p class="eyebrow">INSOMNIA · TICKET PORTAL</p><h1 style="font-size:58px">Your pass.</h1><p class="muted">Enter the details used during registration. Tickets become available only after your class representative verifies the UTR.</p><input id="rid" placeholder="Registration ID"><input id="mobile" placeholder="Mobile number"><input id="pin" placeholder="Retrieval PIN"><button class="btn primary" id="find">Retrieve Ticket</button><div id="out"></div></div></main><script type="module">import{findTicket}from'../src/security.js';import QRCode from'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm';const out=document.querySelector('#out');document.querySelector('#find').onclick=async()=>{out.textContent='Checking…';try{const t=await findTicket(rid.value.trim(),mobile.value.trim(),pin.value.trim());if(!t){out.textContent='Registration not found.';return}if(t.paymentStatus!=='VERIFIED'){out.textContent='Payment verification is still pending or was rejected.';return}const c=document.createElement('div');c.className='card';c.style.marginTop='20px';c.innerHTML=`<p class="eyebrow">THREE NIGHTS · ONE PASS</p><h2>${escapeHtml(t.name)}</h2><p>Ticket <b>${escapeHtml(t.registrationId)}</b></p><canvas id="qr"></canvas><p>Show this QR with your college ID at the gate.</p><button class="btn primary" id="save">Save ticket</button>`;out.replaceChildren(c);await QRCode.toCanvas(c.querySelector('#qr'),t.secureToken,{width:220,margin:2});c.querySelector('#save').onclick=()=>window.print()}catch(e){out.textContent='Unable to retrieve ticket. Please try again.'}};function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
