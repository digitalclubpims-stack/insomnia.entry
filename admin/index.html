<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05091F"><title>Admin · INSOMNIA</title><link rel="stylesheet" href="../styles.css"></head><body><main class="shell"><header class="site-header"><a class="brand" href="../"><span class="brand-mark"></span><span><span class="brand-name">INSOMNIA</span><span class="brand-sub">ADMIN CONTROL</span></span></a><nav class="nav"><a href="../">Home</a><a class="active" href="./">Admin</a></nav></header><section class="page"><div class="page-head"><p class="eyebrow">ADMIN · ONE ACCOUNT</p><h1 class="page-title">Control room.</h1><p>Monitor registrations, payment verification and live entry activity from one protected account.</p></div><div class="panel form-panel" style="width:100%"><div class="field-grid"><div class="field full"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com"></div><div class="field full"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"></div></div><div class="form-actions"><button class="btn primary" id="login">Sign in</button></div><div id="dash"></div></div></section></main><script type="module">import{auth,db}from'../src/firebase.js';import{signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';import{doc,getDoc,collection,getDocs,limit,query}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';login.onclick=async()=>{dash.innerHTML='<div class="status">Loading control room…</div>';try{await signInWithEmailAndPassword(auth,email.value,password.value);const a=await getDoc(doc(db,'admins',auth.currentUser.uid));if(!a.exists())throw Error();const s=await getDocs(query(collection(db,'tickets'),limit(5000)));let p=0,v=0,r=0;s.forEach(x=>{const t=x.data();if(t.paymentStatus==='PENDING')p++;if(t.paymentStatus==='VERIFIED')v++;if(t.paymentStatus==='REJECTED')r++});dash.innerHTML=`<div class="stat-grid" style="margin-top:18px"><article class="panel stat"><div class="stat-value">${s.size}</div><div class="stat-label">Total registrations</div></article><article class="panel stat"><div class="stat-value">${v}</div><div class="stat-label">Verified</div></article><article class="panel stat"><div class="stat-value">${p}</div><div class="stat-label">Pending</div></article><article class="panel stat"><div class="stat-value">${r}</div><div class="stat-label">Rejected</div></article></div><div class="status success" style="margin-top:14px">Admin authorization successful. Use the production Firebase rules before opening the system to attendees.</div>`}catch(e){dash.innerHTML='<div class="status error">Admin authorization failed.</div>'}}</script></body></html>
