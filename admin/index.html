<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | INSOMNIA</title><link rel="stylesheet" href="../styles.css"></head><body><main class="shell"><div class="card"><p class="eyebrow">ADMIN · ONE ACCOUNT</p><h1 style="font-size:60px">Control room.</h1><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="btn primary" id="login">Sign in</button><div id="dash"></div></div></main><script type="module">import{auth,db}from'../src/firebase.js';import{signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';import{doc,getDoc,collection,getDocs,query,orderBy,limit}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';login.onclick=async()=>{try{await signInWithEmailAndPassword(auth,email.value,password.value);const a=await getDoc(doc(db,'admins',auth.currentUser.uid));if(!a.exists())throw Error();const s=await getDocs(query(collection(db,'tickets'),limit(5000)));let p=0,v=0,r=0; s.forEach(x=>{const t=x.data();if(t.paymentStatus==='PENDING')p++;if(t.paymentStatus==='VERIFIED')v++;if(t.paymentStatus==='REJECTED')r++});dash.innerHTML=`<div class="grid"><article><b>${s.size}</b><h3>Total</h3></article><article><b>${v}</b><h3>Verified</h3></article><article><b>${p}</b><h3>Pending</h3></article></div><p>Rejected: ${r}</p><p>Use the CSV tools described in the documentation for bulk operations.</p>`}catch(e){dash.textContent='Admin authorization failed.'}}</script></body></html>
