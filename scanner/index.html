<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gate Scanner | INSOMNIA</title><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body><main class="shell"><div class="card"><p class="eyebrow">LIVE GATE SCANNER · ONLINE ONLY</p><h1 style="font-size:58px">Scan & verify.</h1><select id="night"><option value="NIGHT_01">Night 01</option><option value="NIGHT_02">Night 02</option><option value="NIGHT_03">Night 03</option></select><select id="gate"><option>BOYS</option><option>GIRLS</option></select><input id="email" type="email" placeholder="Operator email"><input id="password" type="password" placeholder="Operator password"><button class="btn primary" id="login">Operator sign in</button><div id="reader" style="margin-top:20px"></div><div id="result"></div><button class="btn primary" id="confirm" style="display:none">CONFIRM ENTRY</button></div></main><script type="module">import{auth,db}from'../src/firebase.js';import{signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';import{collection,query,where,getDocs}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{confirmEntry}from'../src/security.js';let current=null;login.onclick=async()=>{try{await signInWithEmailAndPassword(auth,email.value,password.value);result.textContent='Signed in. Scanner ready.';const qr=new Html5Qrcode('reader');await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},async token=>{await qr.stop();await handle(token,qr)},()=>{});}catch(e){result.textContent='Operator authentication failed or camera unavailable.'}};async function handle(token,qr){try{const s=await getDocs(query(collection(db,'tickets'),where('secureToken','==',token)));if(s.empty){result.textContent='🔴 INVALID TICKET';return}const d=s.docs[0],t=d.data(),n=night.value;if(t.paymentStatus!=='VERIFIED'){result.textContent='🟠 PAYMENT NOT VERIFIED';return}if(t.entry?.[n]?.status==='USED'){result.textContent='🔴 ALREADY USED FOR THIS NIGHT';return}current=d.id;result.innerHTML=`<h2>🟢 VALID TICKET</h2><p><b>${esc(t.name)}</b></p><p>Ticket: ${esc(t.registrationId)}</p><p>Check the attendee's college ID before confirming.</p>`;confirm.style.display='inline-flex';confirm.onclick=async()=>{try{await confirmEntry(current,n,gate.value,auth.currentUser.uid);result.innerHTML='<h2>🟢 ENTRY CONFIRMED</h2><p>Ticket consumed for this night. No re-entry.</p>';confirm.style.display='none';setTimeout(()=>location.reload(),1000)}catch(e){result.textContent=e.message==='ALREADY_USED'?'🔴 ALREADY USED':'🔴 ENTRY COULD NOT BE CONFIRMED'}}}catch(e){result.textContent='Live verification failed. Check internet and retry.'}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
