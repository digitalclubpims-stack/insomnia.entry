<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05091F"><title>Gate Scanner · INSOMNIA</title><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body><main class="shell"><header class="site-header"><a class="brand" href="../"><span class="brand-mark"></span><span><span class="brand-name">INSOMNIA</span><span class="brand-sub">GATE SCANNER</span></span></a><nav class="nav"><a href="../">Home</a><a class="active" href="./">Scanner</a></nav></header><section class="page scanner-shell"><div class="page-head"><p class="eyebrow">LIVE GATE SCANNER · ONLINE ONLY</p><h1 class="page-title">Scan & verify.</h1><p>Choose the current night and gate, sign in as the assigned operator, then scan the attendee's QR. Verify their college ID before confirming entry.</p></div><div class="panel form-panel" style="width:100%"><div class="scanner-controls"><div class="field"><label for="night">Night</label><select id="night" class="input"><option value="NIGHT_01">Night 01</option><option value="NIGHT_02">Night 02</option><option value="NIGHT_03">Night 03</option></select></div><div class="field"><label for="gate">Gate</label><select id="gate" class="input"><option>BOYS</option><option>GIRLS</option></select></div></div><div class="field" style="margin-top:12px"><label for="email">Operator email</label><input id="email" autocomplete="username" placeholder="scanner@example.com"></div><div class="field" style="margin-top:12px"><label for="password">Operator password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"></div><div class="form-actions"><button class="btn primary" id="login">Operator sign in</button></div><div id="status" class="status">Sign in to activate the scanner.</div></div><div class="panel scanner-stage"><div class="scanner-reader"><div id="reader"></div></div><div id="result" class="scanner-result" style="display:none"></div><button class="btn primary" id="confirm" style="display:none;width:100%;margin-top:10px">CONFIRM ENTRY</button></div></section></main><script type="module">import{auth,db}from'../src/firebase.js';import{signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';import{collection,query,where,getDocs}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{confirmEntry}from'../src/security.js';let current=null,scanner=null;const result=document.querySelector('#result'),confirmBtn=document.querySelector('#confirm'),status=document.querySelector('#status');login.onclick=async()=>{try{await signInWithEmailAndPassword(auth,email.value,password.value);status.className='status success';status.textContent='Operator signed in. Camera scanner is ready.';startScanner()}catch(e){status.className='status error';status.textContent='Operator authentication failed.'}};async function startScanner(){if(scanner)return;scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},async token=>{await scanner.stop();scanner=null;await handle(token)})}catch(e){status.className='status error';status.textContent='Camera unavailable. Check browser camera permission and use HTTPS.'}}async function handle(token){result.style.display='block';result.innerHTML='<div>Checking live database…</div>';confirmBtn.style.display='none';try{const s=await getDocs(query(collection(db,'tickets'),where('secureToken','==',token)));if(s.empty){result.innerHTML='<h2 class="result-title result-danger">Invalid ticket</h2><div>This QR is not registered in the live system.</div>';return}const d=s.docs[0],t=d.data(),n=night.value;if(t.paymentStatus!=='VERIFIED'){result.innerHTML='<h2 class="result-title result-warning">Payment not verified</h2><div>This ticket is not active.</div>';return}if(t.entry?.[n]?.status==='USED'){result.innerHTML='<h2 class="result-title result-danger">Already used</h2><div>This ticket has already been used for this night. No re-entry.</div>';return}current=d.id;result.innerHTML=`<h2 class="result-title result-success">Valid ticket</h2><div><strong>${esc(t.name)}</strong><br>Ticket: ${esc(t.registrationId)}<br><span style="color:#9aabba">Verify the attendee's college ID before confirming.</span></div>`;confirmBtn.style.display='flex';confirmBtn.onclick=async()=>{confirmBtn.disabled=true;try{await confirmEntry(current,n,gate.value,auth.currentUser.uid);result.innerHTML='<h2 class="result-title result-success">Entry confirmed</h2><div>Ticket consumed for this night. No re-entry.</div>';confirmBtn.style.display='none';setTimeout(()=>location.reload(),1200)}catch(e){confirmBtn.disabled=false;result.innerHTML='<h2 class="result-title result-danger">Could not confirm</h2><div>'+esc(e.message)+'</div>'}}}catch(e){result.innerHTML='<h2 class="result-title result-danger">Live verification failed</h2><div>Check the internet connection and scan again.</div>'}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
